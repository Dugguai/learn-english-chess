<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn English & Chess</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Learn English & Chess</h1>
    <p>Learn chess. Learn English. Together.</p>
  </header>

  <main>
    <section id="board-section">
      <div id="board" style="width: 400px"></div>
    </section>

    <section id="lesson-section">
      <h2>Lesson 1: The Knight</h2>
      <p>The knight moves in an L-shape.</p>
      <p>It can jump over other pieces.</p>
      <p>A knight is worth about three pawns.</p>
      <button id="next-lesson">Next Lesson</button>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
